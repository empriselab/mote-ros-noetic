name: Build mote-ros-noetic image
description: Builds the project's Docker image (loaded locally) with GitHub Actions layer caching, for use by build/test/lint jobs.

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    - uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: mote-ros-noetic:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
