name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  xmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-image
      - run: |
          docker run --rm --entrypoint bash \
            -v "$PWD/.github/scripts:/ci-scripts:ro" \
            mote-ros-noetic:ci /ci-scripts/xmllint.sh

  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-image
      - run: |
          docker run --rm --entrypoint bash \
            -v "$PWD/.github/scripts:/ci-scripts:ro" \
            mote-ros-noetic:ci /ci-scripts/clang-format.sh

  catkin-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-image
      - run: |
          docker run --rm --entrypoint bash \
            -v "$PWD/.github/scripts:/ci-scripts:ro" \
            mote-ros-noetic:ci /ci-scripts/catkin-lint.sh
